name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        env:
            HUGO_CACHEDIR: /tmp/hugo_cache

        steps:
            - uses: actions/checkout@v4

            - name: Cache Hugo modules
              uses: actions/cache@v4
              with:
                  path: /tmp/hugo_cache
                  key: ${{ runner.os }}-hugo-modules-${{ hashFiles('go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-modules-

            - name: Cache Hugo resources
              uses: actions/cache@v4
              with:
                  path: resources
                  key: ${{ runner.os }}-hugo-resources-${{ hashFiles('content/**/*.jpg', 'content/**/*.png', 'content/**/*.jpeg', 'content/**/*.webp', 'content/**/*.gif') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-resources-

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.21"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "0.161.1"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
