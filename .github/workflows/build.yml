name: build-check
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Hugo
        run: |
          curl -sL https://github.com/gohugoio/hugo/releases/download/v0.152.2/hugo_extended_0.152.2_linux-amd64.tar.gz | tar -xz hugo
          chmod +x hugo
      - name: Build
        run: ./hugo --gc --minify
      - name: Content, anchor and CSP checks
        run: python3 scripts/check-built.py
      - name: Internal link check (no broken refs, no orphaned assets)
        run: python3 scripts/link-check.py
      - name: Collector syntax check
        run: python3 -m py_compile telemetry/server.py
      - name: Install browser test tools
        run: |
          python3 -m venv /tmp/website-browser-tests
          /tmp/website-browser-tests/bin/pip install playwright==1.61.0
          /tmp/website-browser-tests/bin/python -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          python3 -m http.server 8776 --bind 127.0.0.1 --directory public > /tmp/website-test-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8776/ > /dev/null; then break; fi
            sleep 0.2
          done
          /tmp/website-browser-tests/bin/python scripts/audit-console.py http://127.0.0.1:8776
          /tmp/website-browser-tests/bin/python scripts/audit-controls.py http://127.0.0.1:8776
          /tmp/website-browser-tests/bin/python scripts/audit-site.py http://127.0.0.1:8776
