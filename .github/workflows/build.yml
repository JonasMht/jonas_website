name: build-check
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Hugo
        run: |
          curl -sL https://github.com/gohugoio/hugo/releases/download/v0.152.2/hugo_extended_0.152.2_linux-amd64.tar.gz | tar -xz hugo
          chmod +x hugo
      - name: Build
        run: ./hugo --gc --minify
      - name: Zero-JS sanity (content must exist in raw HTML)
        run: |
          for probe in "thermal ablation" "Research →" "Jonas Mehtali"; do
            grep -q "$probe" public/index.html || { echo "MISSING: $probe"; exit 1; }
          done
          grep -q "No cookies" public/legal/index.html || { echo "legal missing"; exit 1; }
      - name: Internal link check (no broken refs, no orphaned assets)
        run: python3 scripts/link-check.py
      - name: CSP sanity (no executable inline scripts)
        run: |
          # The site is served with script-src 'self'. An executable inline
          # <script> would be blocked in production and the page would silently
          # lose its JS — that is exactly how the lab slider and console broke.
          # JSON-LD is data, not script, and is allowed.
          hits=$(grep -rlE '<script(?![^>]*[[:space:]]src=)(?![^>]*application/ld\+json)[^>]*>' public --include='*.html' -P || true)
          if [ -n "$hits" ]; then
            echo "Executable inline <script> found — move it to assets/js/ (see boot.js):"
            echo "$hits" | head -20
            exit 1
          fi
          echo "no executable inline scripts"
      - name: Collector syntax check
        run: python3 -m py_compile telemetry/server.py
