<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode `en` }}">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    <div class="ignition" aria-hidden="true">J.MEHTALI // STATION</div>
    {{ partial "header.html" . }}
    <main id="main-content">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
    <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
